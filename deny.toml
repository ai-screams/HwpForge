# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
unmaintained = "workspace"
ignore = [
  # rand unsoundness only with custom logger + thread_rng reseed; not applicable to HwpForge
  "RUSTSEC-2026-0097",
  # rustybuzz unmaintained (취약점 아님) — krilla 0.8.x 가 상류에서 고정 의존하므로 회피 불가.
  # krilla 가 harfrust 로 이주하면 우리 직접 의존도 함께 이주 (W2 계획 백로그).
  "RUSTSEC-2026-0206",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
skip = []
skip-tree = []

[licenses]
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "Zlib",
  "BSD-3-Clause",
  "BSD-2-Clause", # arrayref (krilla 전이 의존, smithy-pdf W2)
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
