[package]
name = "hwpforge-bindings-mcp"
version.workspace = true
authors.workspace = true
categories.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Vise — HwpForge MCP server for AI-native HWPX document tools"

[[bin]]
name = "hwpforge-mcp"
path = "src/main.rs"

[dependencies]
hwpforge = { path = "../hwpforge", version = "0", features = ["ops"] }
hwpforge-core = { path = "../hwpforge-core", version = "0" }
hwpforge-foundation = { path = "../hwpforge-foundation", version = "0" }
hwpforge-smithy-hwpx = { path = "../hwpforge-smithy-hwpx", version = "0", features = ["schemars"] }
hwpforge-smithy-md = { path = "../hwpforge-smithy-md", version = "0" }
# >=2.0 fixes RUSTSEC advisory GHSA-89vp-x53w-74fx (MCP Host-header validation in <1.4.0); tracks Dependabot #90
# >=3.6 bounds one stdin line (DEFAULT_MAX_LINE_LENGTH); 3.4/3.5 read lines with unbounded `read_until`
rmcp = { version = "3.6", features = ["server", "macros", "transport-io"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
zip = { workspace = true }
