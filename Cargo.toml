[workspace]
members = [
  "crates/hwpforge",
  "crates/hwpforge-bindings-cli",
  "crates/hwpforge-bindings-mcp",
  "crates/hwpforge-bindings-py",
  "crates/hwpforge-blueprint",
  "crates/hwpforge-convert",
  "crates/hwpforge-core",
  "crates/hwpforge-foundation",
  "crates/hwpforge-smithy-hwp5",
  "crates/hwpforge-smithy-hwpx",
  "crates/hwpforge-smithy-md",
  "crates/hwpforge-smithy-pdf",
]
# `fuzz/` is a standalone cargo-fuzz workspace (nightly + libfuzzer-sys only);
# keep it out of the main workspace so normal builds/CI never pull it in.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.16.4"
authors = ["Pignuante <hanyul.ryu@hanyul.xyz>"]
categories = [
  "parser-implementations",
  "encoding",
  "text-processing",
  "template-engine",
  "internationalization",
]
documentation = "https://docs.rs/hwpforge"
edition = "2021"
homepage = "https://ai-screams.github.io/HwpForge/"
keywords = ["hwp", "hwpx", "hancom", "hangul", "korean"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ai-screams/HwpForge"
rust-version = "1.88"

[workspace.dependencies]
# === XML Processing ===
base64 = "0.23"
quick-xml = { version = "0.41", features = ["serialize", "overlapped-lists"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"

# === YAML Processing ===
serde_yaml = "0.9" # deprecated upstream; migration to serde_yml planned

# === ZIP Compression ===
zip = { version = "8.2", default-features = false, features = ["deflate"] }

# === HWP5 Binary ===
byteorder = "1.5"
cfb = "0.14"
encoding_rs = "0.8"
flate2 = "1.0"

# === Markdown ===
pulldown-cmark = "0.13"

# === PDF (smithy-pdf 전용 — krilla 는 rust-version 1.92 요구, 해당 크레이트만 MSRV 상향) ===
krilla = "0.8.2"
rustybuzz = "0.20"

# === Error Handling ===
anyhow = "1.0"
thiserror = "2.0"

# === JSON Schema (for MCP) ===
schemars = { version = "1.2", features = ["preserve_order", "indexmap2"] }

# === Python Bindings ===
pyo3 = { version = "0.28", features = ["extension-module"] }

# === CLI ===
clap = { version = "4.5", features = ["derive", "env"] }

# === Logging ===
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# === Ordered Maps ===
indexmap = { version = "2", features = ["serde"] }

# === Utilities ===
once_cell = "1.21"
sha2 = "0.11"

# === Type System Enhancement ===
derive_more = { version = "2", features = ["full"] }
smallvec = { version = "1.13", features = ["serde", "union"] }
string_cache = "0.9"
strum = { version = "0.28", features = ["derive"] }

# === Testing (dev-dependencies) ===
criterion = { version = "0.8", features = ["html_reports"] }
pretty_assertions = "1.4"
proptest = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
