# Clippy configuration for HwpForge
# See: https://rust-lang.github.io/rust-clippy/

# Be pedantic but practical
avoid-breaking-exported-api = false
cognitive-complexity-threshold = 30
type-complexity-threshold = 500

# quick-xml serde decodes of HWPX parts must go through
# `hwpforge_smithy_hwpx::decoder::xml_from_str`, which pins the recursion and
# namespace-binding limits. quick-xml serde encodes must pass their output
# through `encoder::normalize_attr_control_whitespace` (Hancom misreads control
# character references in attribute values); the call sites that do so opt in
# with `#[allow(clippy::disallowed_methods)]` next to that call. Unit-test
# modules and integration tests that exercise quick-xml directly opt out the
# same way. (Clippy reads only the nearest config file, so this lives here
# rather than in a crate-local one.)
disallowed-methods = [
  { path = "quick_xml::de::from_str", reason = "use hwpforge-smithy-hwpx `decoder::xml_from_str`, which pins the recursion and namespace limits" },
  { path = "quick_xml::de::from_reader", reason = "use hwpforge-smithy-hwpx `decoder::xml_from_str`, which pins the recursion and namespace limits" },
  { path = "quick_xml::de::Deserializer::from_str", reason = "use hwpforge-smithy-hwpx `decoder::xml_from_str`, which pins the recursion and namespace limits" },
  { path = "quick_xml::de::Deserializer::from_reader", reason = "use hwpforge-smithy-hwpx `decoder::xml_from_str`, which pins the recursion and namespace limits" },
  { path = "quick_xml::de::Deserializer::from_str_with_resolver", reason = "use hwpforge-smithy-hwpx `decoder::xml_from_str`, which pins the recursion and namespace limits" },
  { path = "quick_xml::de::Deserializer::borrowing", reason = "use hwpforge-smithy-hwpx `decoder::xml_from_str`, which pins the recursion and namespace limits" },
  { path = "quick_xml::de::Deserializer::borrowing_with_resolver", reason = "use hwpforge-smithy-hwpx `decoder::xml_from_str`, which pins the recursion and namespace limits" },
  { path = "quick_xml::de::Deserializer::with_resolver", reason = "use hwpforge-smithy-hwpx `decoder::xml_from_str`, which pins the recursion and namespace limits" },
  { path = "quick_xml::se::to_string", reason = "pass the output through `encoder::normalize_attr_control_whitespace`, then allow this call there" },
  { path = "quick_xml::se::to_string_with_root", reason = "pass the output through `encoder::normalize_attr_control_whitespace`, then allow this call there" },
  { path = "quick_xml::se::to_writer", reason = "pass the output through `encoder::normalize_attr_control_whitespace`, then allow this call there" },
  { path = "quick_xml::se::to_writer_with_root", reason = "pass the output through `encoder::normalize_attr_control_whitespace`, then allow this call there" },
  { path = "quick_xml::se::to_utf8_io_writer", reason = "pass the output through `encoder::normalize_attr_control_whitespace`, then allow this call there" },
  { path = "quick_xml::se::Serializer::new", reason = "pass the output through `encoder::normalize_attr_control_whitespace`, then allow this call there" },
  { path = "quick_xml::se::Serializer::with_root", reason = "pass the output through `encoder::normalize_attr_control_whitespace`, then allow this call there" },
]
