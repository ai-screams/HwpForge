# =============================================================================
# HwpForge Nightly — Security & Compatibility
# =============================================================================
# Weekly maintenance checks that should not slow down contributor feedback:
#   - cargo-deny advisory scan
#   - beta/nightly toolchain canary
# =============================================================================

name: Nightly

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisory-scan:
    name: "Nightly › Advisory Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.85.10
        with:
          tool: cargo-deny
      - name: Scan for security advisories
        run: cargo deny --all-features check advisories

  toolchain-canary:
    name: "Nightly › Canary (${{ matrix.toolchain }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: [beta, nightly]
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install ${{ matrix.toolchain }} toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: canary-${{ matrix.toolchain }}
      - name: cargo +${{ matrix.toolchain }} check
        run: cargo +${{ matrix.toolchain }} check --workspace --all-targets --all-features

  fuzz-build:
    name: "Nightly › Fuzz Build"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-build
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2.85.10
        with:
          tool: cargo-fuzz
      # Compile-check the fuzz targets so they don't bit-rot. Actual fuzzing
      # runs are manual / on-demand (`cargo +nightly fuzz run <target>`).
      #
      # --target 명시 이유: cargo-fuzz 는 기본 타깃을 "자기 자신이 컴파일된
      # 플랫폼"으로 잡는데, 2026-06-29부터 prebuilt 바이너리가 musl 정적
      # 빌드로 배포되면서 x86_64-unknown-linux-musl 을 골라 ASAN 과 충돌했다
      # ("sanitizer is incompatible with statically linked libc").
      - name: Build fuzz targets
        run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu
