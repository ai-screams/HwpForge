# =============================================================================
# HwpForge — PyPI 배포 (Python 바인딩 에픽 설계 §2.4)
# =============================================================================
#
# 세 가지 이벤트로만 돈다. 태그는 이벤트별로 다른 곳에서 뽑는다.
#   release: published   umbrella `v*` 태그 (release-plz 가 만든 워크스페이스 릴리스)
#   push: tags py-v*     Python 전용 릴리스·재빌드
#   workflow_dispatch    리허설 (기본 대상 = TestPyPI)
#
# 프로덕션(`pypi`)은 위 두 태그 이벤트이거나 dispatch 에서 명시적으로 고를 때만
# 선택된다. 리허설이 실수로 프로덕션을 치지 못하게 하는 구조적 장치다.
#
# **태그는 한 번만 해석한다.** `resolve` 가 `refs/tags/<tag>` 를 커밋 SHA 로 풀고
# 이후 모든 잡이 그 SHA 를 체크아웃한다 — 같은 이름의 브랜치가 태그를 이기거나
# (actions/checkout 의 ref 해석 순서), 실행 도중 태그가 옮겨가 매트릭스 잡마다
# 다른 커밋을 빌드하는 일을 구조적으로 막는다. 게시 직전에 태그가 여전히 그
# SHA 를 가리키는지 다시 확인한다.
#
# 멱등성은 오직 `uv publish --check-url` 에서 온다 — PyPI 는 파일명 재사용을
# 절대 허용하지 않으므로, 버전 단위 사전 검사로 건너뛰지 않는다 (설계 §2.4).
#
# 사용자(관리자) 선행 작업이 없으면 이 워크플로는 **조용히 건너뛰지 않고 실패**한다:
# GitHub environment(`pypi`·`testpypi`)와 PyPI 쪽 pending publisher 가 없으면
# `--trusted-publishing always` 가 인증을 못 만들고 그 자리에서 죽는다.
#
# 모든 액션은 40자리 커밋 SHA 로 핀한다 (태그는 주석). `Standalone › Workflow Lint`
# 가 이 파일의 `uses:` 전부에 대해 그것을 단언한다.
# =============================================================================

name: PyPI Publish

on:
  release:
    types: [published]
  push:
    tags: ["py-v*"]
  workflow_dispatch:
    # 태그를 문자열 입력으로 받지 않는다. 운영자는 "Use workflow from" 에서 태그를
    # 고르고, 그러면 `github.ref`/`github.sha` 가 곧 그 태그와 커밋이 된다 —
    # 체크아웃하는 ref 가 입력에서 오지 않아야 캐시 오염 경로가 닫힌다.
    inputs:
      target:
        description: "Publish target"
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  # 태그 단위. 게시 중인 run 을 취소하면 부분 게시 상태가 남으므로 취소하지 않는다.
  group: pypi-publish-${{ github.ref_name }}
  cancel-in-progress: false

env:
  MATURIN_VERSION: v1.15.0 # 태그된 릴리스 정확 버전만 허용(범위 불가, 4차 run 실측) — ci.yml 과 같은 값

jobs:
  resolve:
    name: "Resolve › Tag"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      target: ${{ steps.validate.outputs.target }}
      version: ${{ steps.validate.outputs.version }}
      is_python_only: ${{ steps.validate.outputs.is_python_only }}
      lock_sha256: ${{ steps.lock.outputs.sha256 }}
    steps:
      - name: Resolve the tag from the ref
        id: raw
        # 세 이벤트 모두 태그 ref 위에서 돈다: `release: published` 와 `py-v*` push
        # 는 태그가 곧 ref 이고, 수동 실행은 "Use workflow from" 에서 태그를 고른다.
        # 그래서 태그 이름은 언제나 `github.ref_name` 이고 커밋은 `github.sha` 다.
        # 릴리스 이벤트는 릴리스가 가리키는 태그와 ref 가 같은지 확인하고,
        # 프리릴리스·draft 는 소리내어 거부한다 (`if:` 로 건너뛰면 required check 를
        # 충족한 것처럼 보인다).
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            release)
              if [ "$RELEASE_PRERELEASE" = "true" ]; then
                echo "::error::this release is marked as a pre-release; HwpForge publishes stable releases only"
                exit 1
              fi
              if [ "$RELEASE_DRAFT" = "true" ]; then
                echo "::error::this release is a draft; publish it first"
                exit 1
              fi
              if [ "$RELEASE_TAG" != "$REF_NAME" ]; then
                echo "::error::the release names tag '$RELEASE_TAG' but the run is on '$REF_NAME'"
                exit 1
              fi
              ;;
            push) ;;
            workflow_dispatch)
              if [ "$REF_TYPE" != "tag" ]; then
                echo "::error::this run started on a $REF_TYPE, not a tag; pick the tag under 'Use workflow from'"
                exit 1
              fi
              ;;
            *) echo "::error::unsupported event $EVENT_NAME"; exit 1 ;;
          esac
          [ -n "$REF_NAME" ] || { echo "::error::no ref name for event $EVENT_NAME"; exit 1; }
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `github.sha` = 이 태그의 커밋. 모든 잡이 같은 것을 받는다 — 입력에서
          # 유도된 ref 를 체크아웃하는 곳은 이제 하나도 없다.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          # 릴리스 빌드는 의도적으로 cold 다 — 캐시는 기본 브랜치와 공유되고, 이
          # 워크플로가 체크아웃하는 ref 는 입력에서 온다 (캐시 오염 경로).
          enable-cache: false
      - name: Validate the tag grammar
        id: validate
        # 문법·버전 일치 규칙은 `.github/scripts/resolve_release_tag.py` 가 소유하고,
        # 같은 파일의 `--self-check` 가 수용/거부 표를 로컬에서 재현한다.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ steps.raw.outputs.tag }}
        run: >-
          uv run --no-project --with packaging
          python .github/scripts/resolve_release_tag.py
          --tag "$TAG" --event-name "$EVENT_NAME" --input-target "$INPUT_TARGET"
          --ref-type "$REF_TYPE"
      - name: Self-check the tag grammar table
        run: >-
          uv run --no-project --with packaging
          python .github/scripts/resolve_release_tag.py --self-check
      - name: Install Rust toolchain
        run: rustup show
      - name: Generate the shared lockfile
        id: lock
        # Cargo.lock 은 이 레포에서 미추적이다. 여기서 한 번 풀고 그 파일을 매트릭스
        # 전원이 내려받아 `--locked` 로 빌드해야 플랫폼별 wheel 이 서로 다른 의존성
        # 해석으로 나오지 않는다 (설계 §2.4 wheel 매트릭스).
        run: |
          set -euo pipefail
          cargo generate-lockfile
          digest="$(sha256sum Cargo.lock | cut -d" " -f1)"
          [ -n "$digest" ] || { echo "::error::could not hash Cargo.lock"; exit 1; }
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "lockfile sha256: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-lock
          path: Cargo.lock
          retention-days: 7
          if-no-files-found: error

  build:
    name: "Build › ${{ matrix.name }}"
    needs: [resolve]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # `platform_tag` 는 산출물 검사에 그대로 쓰이는 fnmatch 패턴이다 — 러너를
        # 갈아끼우면 여기도 같이 고쳐야 검사가 의미를 유지한다.
        # 러너 라벨 출처 = actions/runner-images README (macos-13 은 은퇴, macos-14 는
        # deprecated 표시, 현행 Intel 라벨은 macos-15-intel).
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
            command: build
            target: x86_64
            manylinux: "2_28"
            args: --release --locked
            platform_tag: manylinux_2_28_x86_64
            expect_wheels: 1
            expect_sdists: 0
            smoke: true
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            command: build
            target: aarch64
            manylinux: "2_28"
            args: --release --locked
            platform_tag: manylinux_2_28_aarch64
            expect_wheels: 1
            expect_sdists: 0
            smoke: true
          - name: macos-arm64
            runner: macos-15
            command: build
            target: aarch64-apple-darwin
            manylinux: auto
            args: --release --locked
            platform_tag: macosx_*_arm64
            expect_wheels: 1
            expect_sdists: 0
            smoke: false
          - name: macos-x86_64
            runner: macos-15-intel
            command: build
            target: x86_64-apple-darwin
            manylinux: auto
            args: --release --locked
            platform_tag: macosx_*_x86_64
            expect_wheels: 1
            expect_sdists: 0
            smoke: false
          - name: windows-x64
            runner: windows-latest
            command: build
            target: x64
            manylinux: auto
            args: --release --locked
            platform_tag: win_amd64
            expect_wheels: 1
            expect_sdists: 0
            smoke: false
          - name: sdist
            runner: ubuntu-22.04
            command: sdist
            target: ""
            manylinux: auto
            # `maturin sdist` 는 `--locked` 를 받지 않는다 (1.15 에서
            # "unexpected argument '--locked' found"). 그래서 이 잡의 락파일
            # 불변식은 빌드 **후** 재해시 하나에 걸려 있다.
            args: ""
            platform_tag: ""
            expect_wheels: 0
            expect_sdists: 1
            smoke: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          # 릴리스 빌드는 의도적으로 cold 다 — 캐시는 기본 브랜치와 공유되고, 이
          # 워크플로가 체크아웃하는 ref 는 입력에서 온다 (캐시 오염 경로).
          enable-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cargo-lock
      - name: Verify the shared lockfile
        env:
          LOCK_SHA256: ${{ needs.resolve.outputs.lock_sha256 }}
          WHEN: before the build
        run: bash .github/scripts/verify_lockfile.sh
      - name: Pin the Python-only version
        # `py-v*` 만 해당. 러너의 일회용 체크아웃에서 pyproject 를 제자리 수정하고,
        # 빌드 뒤 원본을 되돌려 `git diff --exit-code` 로 증명한다. 커밋은 없다.
        if: needs.resolve.outputs.is_python_only == 'true'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cat crates/hwpforge-bindings-py/pyproject.toml > "$RUNNER_TEMP/pyproject.orig"
          uv run --no-project python .github/scripts/pin_pyproject_version.py \
            crates/hwpforge-bindings-py/pyproject.toml "$VERSION"
          git --no-pager diff -- crates/hwpforge-bindings-py/pyproject.toml
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: ${{ matrix.command }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          maturin-version: ${{ env.MATURIN_VERSION }}
          working-directory: crates/hwpforge-bindings-py
          args: ${{ matrix.args }} --out ${{ github.workspace }}/dist
      - name: Re-verify the lockfile after the build
        env:
          LOCK_SHA256: ${{ needs.resolve.outputs.lock_sha256 }}
          WHEN: after the build
        run: bash .github/scripts/verify_lockfile.sh
      - name: Restore pyproject.toml
        if: needs.resolve.outputs.is_python_only == 'true'
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/pyproject.orig" > crates/hwpforge-bindings-py/pyproject.toml
          git diff --exit-code -- crates/hwpforge-bindings-py/pyproject.toml
      - name: Assert the artifact is the one this job was asked to build
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PLATFORM_TAG: ${{ matrix.platform_tag }}
          EXPECT_WHEELS: ${{ matrix.expect_wheels }}
          EXPECT_SDISTS: ${{ matrix.expect_sdists }}
        run: |
          set -euo pipefail
          args=(dist "$VERSION" --expect-wheels "$EXPECT_WHEELS" --expect-sdists "$EXPECT_SDISTS")
          if [ -n "$PLATFORM_TAG" ]; then
            args+=(--platform-tag "$PLATFORM_TAG")
          fi
          uv run --no-project python .github/scripts/check_dist.py "${args[@]}"
      - name: Debian 12 import smoke (no pip, same architecture)
        if: matrix.smoke
        # 계획 부록 A-1 과 같은 경로. 러너 아키텍처가 곧 컨테이너 아키텍처다.
        run: |
          set -euo pipefail
          cp crates/hwpforge-bindings-py/tests/smoke_unpacked_wheel.py dist/
          cp tests/fixtures/fields/clickhere_named.hwpx dist/fixture.hwpx
          cat > dist/run_smoke.sh <<'SH'
          set -eu
          python3 - <<'PY'
          import glob
          import zipfile

          whl = sorted(glob.glob("/w/hwpforge-*.whl"))[0]
          zipfile.ZipFile(whl).extractall("/opt/hf")
          print("unpacked:", whl)
          PY
          PYTHONPATH=/opt/hf python3 /w/smoke_unpacked_wheel.py /w/fixture.hwpx
          SH
          docker run --rm -v "$PWD/dist:/w" python:3.11-slim-bookworm bash /w/run_smoke.sh
          rm -f dist/run_smoke.sh dist/smoke_unpacked_wheel.py dist/fixture.hwpx
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # v4 이후 아티팩트는 불변이라 매트릭스 잡들이 같은 이름에 덧쓸 수 없다.
          # 잡별로 올리고 게시 잡이 패턴으로 한 폴더에 합친다.
          name: dist-${{ needs.resolve.outputs.tag }}-${{ matrix.name }}
          path: dist
          retention-days: 14
          if-no-files-found: error

  publish-testpypi:
    name: "Publish › TestPyPI"
    needs: [resolve, build]
    if: needs.resolve.outputs.target == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 신뢰 ref — 이 잡이 실행하는 것은 `.github/scripts/*` 뿐이다.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          # 릴리스 빌드는 의도적으로 cold 다 — 캐시는 기본 브랜치와 공유되고, 이
          # 워크플로가 체크아웃하는 ref 는 입력에서 온다 (캐시 오염 경로).
          enable-cache: false
      - name: Assert the tag still points at the commit we built
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: bash .github/scripts/assert_tag_sha.sh
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: dist-${{ needs.resolve.outputs.tag }}-*
          merge-multiple: true
          path: dist
      - name: Assert the merged set is the whole matrix
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: >-
          uv run --no-project python .github/scripts/check_dist.py dist "$VERSION"
          --expect-wheels 5 --expect-sdists 1 --distinct-platforms
      - name: Publish to TestPyPI
        env:
          TARGET_NAME: TestPyPI
          PUBLISH_URL: https://test.pypi.org/legacy/
          CHECK_URL: https://test.pypi.org/simple/
        run: bash .github/scripts/publish_dist.sh
  publish-pypi:
    name: "Publish › PyPI"
    needs: [resolve, build]
    if: needs.resolve.outputs.target == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 신뢰 ref — 이 잡이 실행하는 것은 `.github/scripts/*` 뿐이다.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          # 릴리스 빌드는 의도적으로 cold 다 — 캐시는 기본 브랜치와 공유되고, 이
          # 워크플로가 체크아웃하는 ref 는 입력에서 온다 (캐시 오염 경로).
          enable-cache: false
      - name: Assert the tag still points at the commit we built
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: bash .github/scripts/assert_tag_sha.sh
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: dist-${{ needs.resolve.outputs.tag }}-*
          merge-multiple: true
          path: dist
      - name: Assert the merged set is the whole matrix
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: >-
          uv run --no-project python .github/scripts/check_dist.py dist "$VERSION"
          --expect-wheels 5 --expect-sdists 1 --distinct-platforms
      - name: Publish to PyPI
        env:
          TARGET_NAME: PyPI
          PUBLISH_URL: https://upload.pypi.org/legacy/
          CHECK_URL: https://pypi.org/simple/
        run: bash .github/scripts/publish_dist.sh

  attach-to-release:
    name: "Attach › GitHub Release"
    needs: [resolve, publish-pypi]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 신뢰 ref — 이 잡이 실행하는 것은 `.github/scripts/*` 뿐이다.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert the tag still points at the commit we built
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: bash .github/scripts/assert_tag_sha.sh
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: dist-${{ needs.resolve.outputs.tag }}-*
          merge-multiple: true
          path: dist
      - name: Upload the artifacts to the release
        # 설계 §2.4 "상대 전달": 상대는 Release 에서 manylinux_2_28 wheel 을 받는다.
        # `release` 이벤트에서만 도는 잡이므로 워크스페이스 릴리스에만 붙는다 —
        # `py-v*` 는 PyPI 로만 나간다 (README 가 그렇게 적혀 있다).
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -print
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
